name: Scrape & Build

on:
  schedule:
    # Lunes, miércoles y viernes a las 05:17 UTC (hora no redonda para evitar colas de GH)
    - cron: "17 5 * * 1,3,5"
  workflow_dispatch:  # permite ejecución manual desde GitHub

concurrency:
  group: scrape-and-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scraper
        run: python scraper.py

      - name: Add affiliate links (HSN)
        run: python añadir_afiliados.py

      - name: Run build
        id: build
        continue-on-error: true
        run: python build.py

      # Publica en el canal los mínimos reales nuevos (data/minimos.json → Telegram).
      # Va antes del commit para que data/avisos_enviados.json se guarde y no se repitan avisos.
      # Solo si el build ha ido bien: nunca se avisa con precios de un build roto.
      # Sin los secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID no publica nada (modo prueba).
      - name: Publicar avisos de mínimos en Telegram
        id: avisos
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python avisos_telegram.py

      - name: Commit & push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ datasets/
          git diff --cached --quiet || git commit -m "build: update prices $(date +'%Y-%m-%d')"
          git pull --rebase origin master
          git push

      - name: Fail si el build tuvo errores
        if: steps.build.outcome == 'failure'
        run: |
          echo "❌ Build finalizó con errores (pares degradados u otro fallo)."
          echo "   Los precios y el HTML están comprometidos. Revisa el log del step 'Run build'."
          exit 1

      - name: Fail si Telegram rechazó algún aviso
        if: steps.avisos.outcome == 'failure'
        run: |
          echo "❌ No se pudo publicar algún aviso en Telegram. Revisa el log del step 'Publicar avisos'."
          echo "   La web y los precios sí se han actualizado; los avisos pendientes se reintentan en el próximo run."
          exit 1
